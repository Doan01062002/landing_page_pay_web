# Chạy trên VPS khi database đặt ở Supabase (không chạy PostgreSQL trên VPS): ứng dụng + Caddy (HTTPS).
# Chuẩn bị .env: DOMAIN, DATABASE_URL (chuỗi "Session pooler" của Supabase), ADMIN_EMAIL, ADMIN_PASSWORD
# Chạy:  docker compose -f docker-compose.supabase.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Chưa đặt DATABASE_URL (chuỗi kết nối Supabase) trong .env}
      PUBLIC_URL: https://${DOMAIN:?Chưa đặt DOMAIN trong .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
