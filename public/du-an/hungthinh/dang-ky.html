<section class="sec"><div class="container"><div class="auth"><div class="auth__side"><img src="assets/img/cars/mazda-cx5-1.webp" alt="" loading="lazy"><h2>Tạo tài khoản miễn phí</h2><ul class="ticks"><li><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Đặt cọc giữ xe nhanh hơn</li><li><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Lưu lịch sử xe đã xem</li><li><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Ưu đãi phụ kiện dành cho thành viên</li></ul></div>
<div class="auth__form"><nav class="crumb" aria-label="Breadcrumb"><a href="index.html">Trang chủ</a><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg><span aria-current="page">Đăng ký</span></nav><h1>Đăng ký</h1><p class="demo-note"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>Giao diện minh hoạ – không tạo tài khoản thật và không lưu dữ liệu.</span></p>
<form data-demo-form data-replace data-success="Đây là bản demo nên không có tài khoản nào được tạo.">
<div class="grid2"><label class="field"><span>Họ và tên *</span><input name="name" required autocomplete="name"></label><label class="field"><span>Số điện thoại *</span><input name="phone" type="tel" required pattern="0[0-9]{9}" data-msg="Số điện thoại gồm 10 số, bắt đầu bằng 0" autocomplete="tel"></label></div>
<label class="field"><span>Email *</span><input name="email" type="email" required autocomplete="email"></label>
<div class="grid2"><label class="field pwd"><span>Mật khẩu *</span><input name="pass" type="password" required minlength="6" autocomplete="new-password"><button type="button" data-pwd aria-label="Hiện mật khẩu"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
<label class="field pwd"><span>Nhập lại mật khẩu *</span><input name="pass2" type="password" required minlength="6" data-match="pass" autocomplete="new-password"><button type="button" data-pwd aria-label="Hiện mật khẩu"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label></div>
<label class="check"><input type="checkbox" name="agree" required> Tôi đồng ý với điều khoản sử dụng (demo).</label><div class="field" style="margin:0"></div>
<button class="btn btn--y btn--block" type="submit" style="margin-top:14px">Tạo tài khoản</button></form>
<p class="auth__alt">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p></div></div></div></section>
