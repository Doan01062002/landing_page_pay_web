<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea212b" />
    <!--head:start-->
    <title>Phần mềm quản lý gara ô tô & website showroom | ChungAuto</title>
    <meta name="description" content="Website và phần mềm dựng sẵn cho gara ô tô, tiệm sửa xe máy, đại lý, showroom xe cũ, cửa hàng phụ kiện. Bàn giao 7 ngày, tặng landing page quảng cáo." />
    <!--head:end-->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Phông tiếng Việt: Be Vietnam Pro (chữ thân), Barlow Condensed / Montserrat (tiêu đề). Tải không chặn hiển thị; noscript dự phòng -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&family=Montserrat:wght@800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&family=Montserrat:wght@800&display=swap" />
    </noscript>
    <!-- Màn mở đầu logo (trang chủ, Kho mẫu; một lần mỗi phiên): che trang ngay từ lần vẽ đầu, trước khi JS tải xong -->
    <script>
      ;(function () {
        try {
          var p = location.pathname.replace(/(.)\/$/, '$1')
          // website mẫu chạy riêng (xem thử): thêm phông riêng của từng mẫu
          if (/^\/(preview|lp)\//.test(p)) {
            var f = document.createElement('link')
            f.rel = 'stylesheet'
            f.href = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Montserrat:wght@500;700&family=Lexend:wght@400;600;700&family=Roboto+Condensed:wght@600;700&family=Anton&display=swap'
            document.head.appendChild(f)
          }
          var k = { '/': 'chungauto_intro', '/mau-phan-mem': 'chungauto_intro_kho' }[p]
          var q = new URLSearchParams(location.search)
          if (!k || q.get('embed') === '1') return
          if (q.get('intro') !== '1' && sessionStorage.getItem(k)) return
          document.documentElement.classList.add('intro-pre', 'intro-hold')
          // logo màn mở đầu là phần tử lớn hiện đầu tiên: tải ngay, không đợi JS
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.href = '/brand/logo-vector.svg'
          document.head.appendChild(l)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-boot-->
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
